<!doctype html>
<html lang="en" data-theme="dark" data-gpu-mode="high">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111115" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>NexusTavern</title>
    <style id="bb-early-splash-style">
      html,body{margin:0;padding:0;background-color:#111115;color:#ececf4;}
      #bb-early-splash{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 42%,#1a1d2c 0%,#111115 62%);font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:opacity 200ms cubic-bezier(0.2,0,0,1);}
      #bb-early-splash.is-hidden{opacity:0;pointer-events:none;}
      .bb-early-splash__center{width:min(380px,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;}
      .bb-early-splash__logo{width:58px;height:58px;display:block;color:#ececf4;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45)) drop-shadow(0 0 26px rgba(101,117,179,.34));}
      .bb-early-splash__title{font-family:'PT Serif',Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;letter-spacing:.03em;color:#ececf4;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.32);}
      .bb-early-splash__progress{width:100%;max-width:248px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:2px;}
      .bb-early-splash__track{position:relative;width:100%;height:4px;border-radius:9999px;background:#2e2e38;overflow:hidden;}
      .bb-early-splash__bar{position:absolute;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,#6575b3 0%,#8294c4 100%);animation:bb-early-indeterminate 1.85s cubic-bezier(0.65,0.815,0.735,0.395) infinite;}
      .bb-early-splash__meta{font-family:'JetBrains Mono','Consolas',monospace;font-size:11px;letter-spacing:.04em;color:#8a8a9e;}
      .bb-early-splash__version{display:inline-flex;align-items:center;justify-content:center;height:22px;margin-top:2px;padding:0 10px;border-radius:9999px;border:1px solid rgba(101,117,179,.38);background:rgba(101,117,179,.14);color:#ececf4;font-family:'JetBrains Mono','Consolas',monospace;font-size:11px;font-weight:600;letter-spacing:.03em;line-height:1;box-sizing:border-box;}
      @keyframes bb-early-indeterminate{0%{left:-35%;right:100%;}60%,100%{left:100%;right:-90%;}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="bb-early-splash" role="status" aria-live="polite" aria-label="Loading NexusTavern">
      <div class="bb-early-splash__center">
        <svg class="bb-early-splash__logo" viewBox="0 0 726 726" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <g transform="translate(0,726) scale(0.1,-0.1)" fill="currentColor" stroke="none">

          </g>
        </svg>
        <div>
          <h1 class="bb-early-splash__title">NexusTavern</h1>
        </div>
        <div class="bb-early-splash__progress">
          <div class="bb-early-splash__track" aria-hidden="true">
            <div class="bb-early-splash__bar"></div>
          </div>
          <div class="bb-early-splash__meta">Stage 0 / 3 &middot; Starting application</div>
          <span class="bb-early-splash__version">0.5.0-beta.1</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
